<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="AllyFix icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#248a70"/>
      <stop offset="1" stop-color="#175a4a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background (Shopify applies rounded-corner mask automatically) -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Accessibility figure (universal a11y person), in white -->
  <g fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- arms -->
    <path d="M395 505 H735"/>
    <!-- torso -->
    <path d="M565 495 V640"/>
    <!-- legs -->
    <path d="M565 640 L470 815"/>
    <path d="M565 640 L660 815"/>
  </g>
  <!-- head -->
  <circle cx="565" cy="360" r="78" fill="#ffffff" filter="url(#soft)"/>

  <!-- "Fix" check badge, bottom-right -->
  <g filter="url(#soft)">
    <circle cx="800" cy="815" r="150" fill="#ffffff"/>
    <path d="M735 815 L785 868 L872 762" fill="none" stroke="#1f8a63" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
